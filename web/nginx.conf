# Keep the scheme a tunnel or outer proxy saw, so the session cookie gets
# Secure only when the browser is really on https.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index rivian-dashboard.html;
    # Relative Location headers, so the login redirect keeps whatever host
    # and port the browser used (the container itself listens on 80).
    absolute_redirect off;

    # Favicons live in ./static, not ./www.
    location = /favicon.ico {
        alias /usr/share/nginx/html-static/favicon.ico;
    }
    location = /apple-touch-icon.png {
        alias /usr/share/nginx/html-static/apple-touch-icon.png;
    }

    # Asked before every gated request. Always answers 200 when
    # WATTSON_DASHBOARD_TOKEN is unset, so the dashboard stays open.
    location = /api/auth/check {
        internal;
        proxy_pass http://api:5000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /api/health {
        proxy_pass http://api:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /login {
        proxy_pass http://api:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /logout {
        proxy_pass http://api:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @login {
        return 302 /login;
    }

    # DC charging-cost API (Flask). The dashboard POSTs here when you
    # record what you paid at a public fast charger.
    location /api/ {
        auth_request /api/auth/check;
        error_page 401 = @login;
        proxy_pass http://api:5000;
        proxy_set_header Host $http_host;
    }

    # Never cache the dashboard HTML: it rebuilds after every poll.
    location / {
        auth_request /api/auth/check;
        error_page 401 = @login;
        try_files $uri $uri/ /rivian-dashboard.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
